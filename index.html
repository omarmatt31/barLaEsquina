<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar La Esquina - Sistema de Gestión</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#F2994A">
    <link rel="apple-touch-icon" href="./icono-192.png">
</head>
<body>

    <header>
        <h1>La Esquina Bar</h1>
        <nav>
            <ul>
                <li><a href="#seccion-salon">Salón</a></li>
                <li><a href="#seccion-carta">Carta</a></li>
                <li><a href="#seccion-caja">Caja del día</a></li>
            </ul>
        </nav>
        <div id="acciones-exportacion">
            <button type="button" id="btn-exportar">Exportar</button>
            <button type="button" id="btn-importar">Importar</button>
        </div>
    </header>

    <main>

        <section id="seccion-salon">
            <h2>Salón</h2>
            <div id="contenedor-salon">
                <div id="grilla-mesas">
                    <!-- Grilla vacía para las mesas -->
                </div>
                <aside id="panel-pedido">
                    <h3>Pedido de la mesa elegida</h3>
                    <div id="detalle-pedido">
                        <!-- Panel lateral con el pedido de la mesa elegida -->
                    </div>
                </aside>
            </div>
        </section>

        <section id="seccion-carta">
            <h2>Carta</h2>
            <form id="form-producto">
                <fieldset>
                    <legend>Agregar producto</legend>

                    <label for="input-nombre-producto">Nombre</label>
                    <input type="text" id="input-nombre-producto" name="nombre"
                           autocomplete="off" autocapitalize="words" required>

                    <label for="select-categoria-producto">Categoría</label>
                    <select id="select-categoria-producto" name="categoria" required>
                        <option value="">Seleccioná una categoría</option>
                    </select>

                    <label for="input-precio-producto">Precio</label>
                    <input type="number" id="input-precio-producto" name="precio"
                           inputmode="decimal" step="0.01" min="0" required>

                    <label for="checkbox-disponible">
                        <input type="checkbox" id="checkbox-disponible" name="disponible">
                        Disponible
                    </label>

                    <button type="submit" id="btn-agregar-producto">Agregar producto</button>
                </fieldset>
            </form>

            <div id="lista-productos">
                <!-- Lista vacía de productos -->
            </div>
        </section>

        <section id="seccion-caja">
            <h2>Caja del día</h2>
            <table id="tabla-caja">
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Tabla vacía -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
